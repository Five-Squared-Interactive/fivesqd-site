<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/images/fivesquared-gradient.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta
      name="description"
      content="Five Squared Interactive — Open tools for building and exploring 3D worlds on the web. WebVerse, WorldHub, WorldOS, and more."
    />
    <link rel="apple-touch-icon" href="/images/fivesquared-gradient.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Five Squared Interactive — Web Wide Worlds" />
    <meta property="og:description" content="Open tools for building and exploring 3D worlds on the web. WebVerse, WorldHub, WorldOS, and more." />
    <meta property="og:image" content="https://fivesqd.com/images/webwideworlds-ecosystem.png" />
    <meta property="og:url" content="https://fivesqd.com" />
    <meta property="og:site_name" content="Five Squared Interactive" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Five Squared Interactive — Web Wide Worlds" />
    <meta name="twitter:description" content="Open tools for building and exploring 3D worlds on the web. WebVerse, WorldHub, WorldOS, and more." />
    <meta name="twitter:image" content="https://fivesqd.com/images/webwideworlds-ecosystem.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" /></noscript>

    <link rel="canonical" href="https://fivesqd.com/" />

    <title>Five Squared Interactive</title>

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'unsafe-inline';
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src https://fonts.gstatic.com;
                   img-src 'self' data:;
                   frame-src https://webverse-webgl.s3.amazonaws.com;
                   connect-src 'self';
                   object-src 'none';
                   base-uri 'self';" />

    <!-- SPA redirect handler for GitHub Pages 404 -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
